[project]
name = "summation-cli"
dynamic = ["version"]
description = "Public CLI for the Summation API (sum-api)."
readme = "README-pypi.md"
requires-python = ">=3.11"
authors = [{ name = "Summation" }]
license = { text = "Proprietary" }
keywords = ["summation", "cli", "sumcli", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "click>=8.0",
]

[project.urls]
Homepage = "https://summation.com"
Documentation = "https://summation-676748f5-docs-api-and-integrations.mintlify.app/integrations/cli"
Repository = "https://github.com/summationai/summation-cli"
Issues = "https://github.com/summationai/summation-cli/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
sumcli = "sum_cli.cli.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "sum_cli/__init__.py"

[tool.hatch.build.targets.sdist]
# README.md is the maintainer doc and stays in-repo; README-pypi.md is the only
# README the package ships (it is also the ``readme`` long description).
include = [
    "/sum_cli",
    "/README-pypi.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["sum_cli"]

[tool.hatch.build]
include = [
    "sum_cli/data/openapi_snapshot.json",
]
