<!DOCTYPE html>

<head>
  <meta charset="utf-8" />
  <title>sumcli install</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    code { background: #f4f4f5; padding: 0.1em 0.35em; border-radius: 4px; }
    pre { background: #f4f4f5; padding: 1rem; overflow-x: auto; border-radius: 6px; }
    a { color: #0f172a; }
  </style>

<body>
  <h1>sumcli</h1>
  <p>Install the Summation CLI (<code>summation-cli</code> on PyPI).</p>
  <h2>macOS / Linux</h2>
  <pre><code>curl -fsSL https://install.summation.com/sumcli | sh</code></pre>
  <h2>Windows (PowerShell)</h2>
  <pre><code>irm https://install.summation.com/sumcli.ps1 | iex</code></pre>
  <h2>Already have uv?</h2>
  <pre><code>uv tool install summation-cli</code></pre>
  <p>
    <a href="https://github.com/summationai/summation-cli">Source</a> ·

  </p>
